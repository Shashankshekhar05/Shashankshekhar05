<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#0a0a23" />
      <stop offset="1" stop-color="#1a1a4e" />
    </linearGradient>
    <radialGradient id="particle" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <style>
      .title { font: bold 54px 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #ffffff; }
      .subtitle { font: 18px 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; fill: #dbeafe; }
      .particle { fill: url(#particle); opacity: 0.85; }
    </style>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)" />

  <!-- code particle effect -->
  <g opacity="0.9">
    <circle class="particle" cx="80" cy="60" r="2" />
    <circle class="particle" cx="140" cy="120" r="1.8" />
    <circle class="particle" cx="220" cy="40" r="2.5" />
    <circle class="particle" cx="320" cy="90" r="1.6" />
    <circle class="particle" cx="420" cy="30" r="2.2" />
    <circle class="particle" cx="520" cy="140" r="1.4" />
    <circle class="particle" cx="620" cy="80" r="2.1" />
    <circle class="particle" cx="720" cy="110" r="1.7" />
    <circle class="particle" cx="840" cy="50" r="2.6" />
    <circle class="particle" cx="960" cy="130" r="1.5" />
    <circle class="particle" cx="1080" cy="70" r="2" />
  </g>

  <!-- subtle code lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M60 320 h1080 M60 280 h1080 M60 240 h1080" stroke-linecap="round" />
  </g>

  <!-- Centered text -->
  <text x="600" y="150" class="title" text-anchor="middle">Shashank Shekhar</text>
  <text x="600" y="190" class="subtitle" text-anchor="middle">Full Stack Developer | Ultra Visual Builder</text>

  <!-- small accent line -->
  <rect x="420" y="210" width="360" height="6" rx="3" fill="#7c3aed" opacity="0.95" />
</svg>
